general {
	hide_cursor = true
	ignore_empty_input = true
}

background {
	path = screenshot
	color = rgba(000000ff)

	blur_passes = 3
	blur_size = 3

	noise = 0.01

	vibrancy = 0
	vibrancy_darkness = 0

	brightness = 0.8
}

input-field {
	monitor = HDMI-A-1
	size = 200, 25
	outline_thickness = 3
	
	dots_size = 0.2
	dots_spacing = 1
	dots_center = true
	dots_rounding = 0

	font_size = 12
	font_color = rgba(ffffffff)
	font_family = HackNerdFontMono

	fade_on_empty = false
	placeholder_text = password...

	rounding = 0

	outer_color = rgba(00000000)
	inner_color = rgba(000000ff)

	capslock_color = rgba(aaaa55ff)

	check_color = rgba(ffffffff)
	fail_color = rgba(ee5555ff)

	position = 0,0
	halign = center
	valign = center
}

label {
	monitor = DVI-I-1
	text = o.~
	color = rgba(ffffffaa)

	position = 0,-30
	haling = center
	valign = center
}

label {
	monitor = DVI-I-1
	text = $TIME
	font_size=36
	color = rgba(ffffffaa)

	position = 0,30
	halign = center
	valign = center
}

