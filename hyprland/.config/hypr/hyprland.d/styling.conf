general {
	gaps_in = 3
	gaps_out = 6

	border_size = 0

	col.active_border = rgba(000000ff)
	col.inactive_border = rgba(000000ff)

	layout = dwindle

	allow_tearing = true
}

decoration {
	rounding = 0
	rounding_power = 2

	active_opacity = 1.0
	inactive_opacity = 1.0

	shadow {
		enabled = false
		range = 5
		render_power = 3
		color = rgba(aaaaaa0a)
	}

	blur {
		enabled = false
		size = 3
		passes = 1

		vibrancy = 0.1696
	}
}
